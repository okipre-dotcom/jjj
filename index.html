<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FP1級">
<title>FP1級 応用編トレーナー</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--sub:#667;--acc:#2563eb;--accD:#1e40af;--ok:#16a34a;--ng:#dc2626;--warn:#d97706;--chip:#e0e7ff;--line:#e2e8f0;--gold:#f59e0b}
html[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--ink:#e7edf5;--sub:#9aa7b8;--acc:#3b82f6;--accD:#bfdbfe;--ok:#22c55e;--ng:#f87171;--warn:#fbbf24;--chip:#1e3a8a;--line:#334155;--gold:#fbbf24}
html[data-theme="dark"] .tabs{background:#1e293b}
html[data-theme="dark"] details{background:#0b1220}
html[data-theme="dark"] .process{background:#0b2417;color:#d1fae5}
html[data-theme="dark"] .chips button{background:#1e293b}
html[data-theme="dark"] .btn.ghost{background:#1e293b;color:var(--sub)}
html[data-theme="dark"] .rbox{background:#1e293b}
html[data-theme="dark"] .nhid{background:#0b1220;color:#64748b}
html[data-theme="dark"] .nres{background:#0b1220;color:var(--accD)}
html[data-theme="dark"] .nres.shown{background:#14532d;color:#bbf7d0}
html[data-theme="dark"] .ansfield input,html[data-theme="dark"] .ninput{background:#0b1220;color:var(--ink)}
html[data-theme="dark"] .expl{color:#cbd5e1}
html[data-theme="dark"] .blank.open{background:#14532d;color:#bbf7d0}
html[data-theme="dark"] .xblank.open{background:#78350f;color:#fde68a}
html[data-theme="dark"] .ansfield input.good,html[data-theme="dark"] .ninput.good{background:#052e16}
html[data-theme="dark"] .ansfield input.bad,html[data-theme="dark"] .ninput.bad{background:#450a0a}
html[data-font="s"] .qtext,html[data-font="s"] .calcbody,html[data-font="s"] .expl,html[data-font="s"] .process{font-size:13px}
html[data-font="l"] .qtext,html[data-font="l"] .calcbody,html[data-font="l"] .expl,html[data-font="l"] .process{font-size:19px;line-height:1.85}
html[data-font="xl"] .qtext,html[data-font="xl"] .calcbody,html[data-font="xl"] .expl,html[data-font="xl"] .process{font-size:23px;line-height:1.95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.75;overflow-anchor:none}
header{position:sticky;top:0;z-index:10;background:var(--acc);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:14px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.18);border-radius:14px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.combo{background:var(--gold);transition:transform .15s}
.pill.combo.bump{transform:scale(1.35)}
#sndBtn,#thBtn,#fontBtn{background:none;border:0;color:#fff;font-size:17px;padding:2px 4px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;padding:7px 2px 6px;border:0;background:none;font-size:10px;color:var(--sub);border-top:3px solid transparent;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;min-height:54px}
.tabs button.hidden{display:none}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--acc);border-top-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:10px 12px calc(120px + env(safe-area-inset-bottom,0))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;font-size:13px;color:var(--sub)}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips button.mode.on{background:var(--gold);border-color:var(--gold)}
.ymsel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:14px;margin:2px 6px 2px 0;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.07);position:relative;overflow:hidden}
.card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.card.flash{animation:flash .5s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 1px 3px rgba(0,0,0,.07)}}
.meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{background:var(--chip);color:var(--accD);border-radius:6px;padding:1px 8px;font-weight:600}
.qtext{white-space:pre-wrap;font-size:15px}
.blank{display:inline-block;min-width:54px;text-align:center;background:var(--chip);color:var(--accD);border:1.5px dashed var(--acc);border-radius:8px;padding:0 8px;margin:1px 2px;font-weight:700;cursor:pointer;user-select:none}
.blank.open{background:#dcfce7;border-color:var(--ok);color:#166534;border-style:solid}
.xblank{display:inline-block;min-width:40px;text-align:center;background:#fef3c7;color:#92400e;border:1.5px dashed var(--warn);border-radius:8px;padding:0 8px;margin:1px 2px;font-weight:700;cursor:pointer;user-select:none}
.xblank.open{background:#fde68a;border-style:solid}
.nblank{display:inline-block;min-width:46px;text-align:center;background:#ede9fe;color:#5b21b6;border:1.5px dashed #7c3aed;border-radius:8px;padding:0 8px;font-weight:700;cursor:pointer;user-select:none}
.nblank.open{background:#ddd6fe;border-style:solid}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:#fff}
.btn.hard{background:var(--warn);color:#fff}
.btn.easy{background:var(--accD);color:#fff}
.ivlh{display:block;font-size:10px;font-weight:600;opacity:.85;margin-top:2px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
details{margin-top:12px;background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:14px}
details summary{font-weight:700;color:var(--acc);cursor:pointer}
.expl{white-space:pre-wrap;margin-top:8px;color:#334}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat .card{text-align:center;margin:0}
.stat .num{font-size:26px;font-weight:800;color:var(--acc)}
.small{font-size:12px;color:var(--sub)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:6px 0}
.toggle input{width:20px;height:20px}
.anstable{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.anstable td{border:1px solid var(--line);padding:7px 10px;line-height:1.5}
.anstable td:first-child{width:2.4em;text-align:center;font-weight:700;color:var(--acc)}
.anstable .anssec td{background:var(--chip);font-weight:800;color:var(--ink);border-left:4px solid var(--acc);font-size:13px;letter-spacing:.02em}
html[data-theme="dark"] .anstable .anssec td{background:#0b1220}
.qdata{margin:8px 0;overflow-x:auto}
.qdata table{border-collapse:collapse;font-size:13px;width:100%;background:var(--card)}
.qdata caption{font-weight:700;text-align:left;padding:4px 0;font-size:13px}
.qdata th,.qdata td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.qdata td.num{text-align:right;font-variant-numeric:tabular-nums}
.qdata td.txt{white-space:normal;text-align:left;line-height:1.6;min-width:13em}
.qdata th{background:var(--rbox,#f1f5f9)}
.calcbody{white-space:pre-wrap;font-size:15px;line-height:1.75;font-feature-settings:"tnum";background:var(--card);border-left:3px solid var(--line);padding:8px 12px;border-radius:8px}
.process{white-space:pre-wrap;background:#f0fdf4;border-radius:10px;padding:14px;margin-top:10px;font-size:14px;line-height:1.85;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-feature-settings:"tnum";overflow-x:auto}
.ansline{font-size:18px;font-weight:800;color:var(--ok);margin-top:10px;background:rgba(22,163,74,.10);border-left:4px solid var(--ok);padding:8px 12px;border-radius:8px}
html[data-theme="dark"] .ansline{background:rgba(34,197,94,.15)}
.hidden{display:none}
.ansfield{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}
.ansfield label{font-size:14px;font-weight:600;min-width:120px}
.ansfield input{flex:1;min-width:130px;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:10px;text-align:right;font-feature-settings:"tnum"}
.ansfield input:focus{border-color:var(--acc);outline:none}
.ansfield input.good{border-color:var(--ok);background:#f0fdf4}
.ansfield input.bad{border-color:var(--ng);background:#fef2f2}
.ansfield .unit{font-weight:700}
.ansfield .corr{font-size:13px;color:var(--ng);font-weight:700;width:100%}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:42px;font-weight:900;pointer-events:none;z-index:99;animation:floatUp 1s forwards}
.float.plus{color:var(--ok)}
.float.minus{color:var(--ng)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.comboMsg{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 1px 0 #fff;pointer-events:none;z-index:99;animation:floatUp 1.2s forwards}
.spark{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:98;animation:sp .8s forwards}
@keyframes sp{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
#queueBanner .qb{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border-radius:12px;padding:10px 14px;margin:4px 0 8px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
#queueBanner .qb button{margin-left:auto;background:#fff;color:var(--acc);border:0;border-radius:8px;padding:7px 14px;font-weight:800}
.fcard{background:var(--card);border-radius:16px;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;font-size:18px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer;user-select:none}
.fcard .fb{color:var(--acc);font-size:24px;margin-top:10px}
.ninput{width:120px;font-size:15px;padding:6px;border:2px solid #7c3aed;border-radius:8px;text-align:right;margin:1px 2px;font-feature-settings:"tnum"}
.ninput.good{border-color:var(--ok);background:#f0fdf4}
.ninput.bad{border-color:var(--ng);background:#fef2f2}
.ncorr{font-size:12px;color:var(--ng);font-weight:700}
.nhid{display:inline-block;min-width:30px;text-align:center;background:#f1f5f9;border:1.5px dashed #94a3b8;border-radius:6px;color:#94a3b8;padding:0 6px;font-weight:700}
.nres{display:inline-block;min-width:30px;text-align:center;background:#eef2ff;border:1.5px dashed var(--acc);border-radius:6px;color:var(--acc);padding:0 6px;font-weight:700}
.nres.shown{background:#dcfce7;border-style:solid;color:#166534}
.nshow{color:var(--sub);font-weight:600}
.nsel{width:auto;min-width:74px;padding:5px 6px;text-align:left;font-feature-settings:normal}
.rmodal{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.78);display:flex;align-items:center;justify-content:center;animation:rfade .3s;padding:20px}
@keyframes rfade{from{opacity:0}to{opacity:1}}
.rbox{background:#fff;border-radius:18px;padding:26px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:rpop .35s}
@keyframes rpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.rtier{font-size:30px;font-weight:900;letter-spacing:1px}
.rmodal.rA .rtier{color:var(--gold)}.rmodal.rB .rtier{color:var(--ok)}.rmodal.rC .rtier{color:var(--ng)}
.rscore{font-size:56px;font-weight:900;color:var(--acc);line-height:1.1;margin:6px 0}
.rscore span{font-size:20px;color:var(--sub)}
.rmsg{font-size:15px;font-weight:700;margin-top:4px}
.rsub{font-size:13px;color:var(--sub);margin-top:8px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px;text-align:center;font-size:11px;color:var(--sub)}

/* ===== v5.00 UI ===== */
#goalBar{position:sticky;top:40px;z-index:9;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--sub)}
html[data-theme="dark"] #goalBar{background:#1e293b}
.gbar{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
#gfill{height:100%;width:0;background:var(--acc);transition:width .45s ease}
#goalBar.done #gfill{background:var(--gold)}
#goalBar.done #gtxt{color:var(--gold);font-weight:800}
#gtxt{white-space:nowrap;font-weight:700}
#gset{background:none;border:0;color:var(--sub);font-size:15px;padding:0 2px;line-height:1}
#fab{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0));z-index:25;background:var(--acc);color:#fff;border:0;border-radius:26px;padding:13px 22px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#fab.show{display:block}
#fab:active{transform:scale(.94)}
#gradeFab{position:fixed;right:14px;bottom:calc(124px + env(safe-area-inset-bottom,0));z-index:25;background:var(--ok);color:#fff;border:0;border-radius:26px;padding:13px 20px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#gradeFab.show{display:block}
#gradeFab:active{transform:scale(.94)}
/* タップ域・入力最適化 */
.blank,.xblank,.nblank{min-height:30px;line-height:1.9}
.btn{min-height:48px}
.ninput,.ansfield input{min-height:42px;font-size:16px}
.chips button{min-height:38px}
.tabs button:active{background:rgba(127,127,127,.12)}


/* v5.1 入力採点 */
.ninput.good,.ansfield input.good{background:#dcfce7;border-color:var(--ok)}
.ninput.bad,.ansfield input.bad{background:#fee2e2;border-color:var(--ng)}
.qbk{min-width:88px}
.ansfix{color:var(--ok);font-weight:700;margin-left:3px;font-size:13px;white-space:nowrap}
.gradehint{font-size:12px;color:var(--sub);margin:6px 2px}


/* v5.2 簡易電卓 */
#calcFab{position:fixed;left:14px;bottom:calc(66px + env(safe-area-inset-bottom,0));z-index:25;background:var(--accD);color:#fff;border:0;border-radius:50%;width:50px;height:50px;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#calcFab.show{display:block}
#calcFab:active{transform:scale(.93)}
#calcPad{position:fixed;left:10px;right:10px;max-width:330px;margin:0 auto;bottom:calc(124px + env(safe-area-inset-bottom,0));z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px;display:none}
#calcPad.show{display:block}
#dataFab{position:fixed;left:14px;bottom:calc(126px + env(safe-area-inset-bottom,0));z-index:25;background:var(--acc);color:#fff;border:0;border-radius:50%;width:50px;height:50px;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#guideFab{position:fixed;left:14px;bottom:calc(186px + env(safe-area-inset-bottom,0));z-index:25;background:var(--warn);color:#fff;border:0;border-radius:50%;width:50px;height:50px;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#guideFab.show{display:block}
#guidePanel{position:fixed;left:10px;right:10px;max-width:360px;margin:0 auto;bottom:calc(184px + env(safe-area-inset-bottom,0));z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:50vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none}
#guidePanel.show{display:block}
#dataFab.show{display:block}
#dataFab:active{transform:scale(.93)}
#dataPanel{position:fixed;left:10px;right:10px;max-width:360px;margin:0 auto;bottom:calc(124px + env(safe-area-inset-bottom,0));z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px;display:none;max-height:72vh;overflow:auto}
#dataPanel.show{display:block}
#dataPanel .dpbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:sticky;top:-10px;background:var(--card);padding:4px 0}
#dataPanel img{cursor:zoom-in}
#calcClose{float:right;background:none;border:0;color:var(--sub);font-size:18px;line-height:1;padding:0 2px}
#calcPrev{text-align:right;color:var(--sub);font-size:13px;min-height:16px;margin:2px 4px}
#calcDisp{background:var(--bg);border-radius:8px;padding:8px 10px;text-align:right;font-size:22px;font-weight:800;min-height:34px;word-break:break-all;margin-bottom:8px}
.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calcgrid button{padding:14px 0;border:0;border-radius:10px;background:var(--bg);font-size:19px;font-weight:700;color:var(--ink)}
.calcgrid button:active{filter:brightness(.92)}
.calcgrid button.op{background:var(--chip);color:var(--accD)}
.calcgrid button.eq{background:var(--acc);color:#fff}
.calcgrid button.fn{background:var(--ng);color:#fff;font-size:16px}

.expl{white-space:normal;line-height:1.85}
.expl .el{margin:.5em 0}
.qtext{line-height:1.8}
.expl .calc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--chip);color:var(--ink);padding:7px 11px;border-radius:8px;margin:7px 0;overflow-x:auto;white-space:pre;font-size:.96em;line-height:1.7}
html[data-theme="dark"] .expl .calc{background:#0b1220;color:#e7edf5}
.expl .ansx{display:block;font-weight:800;color:var(--ok);background:rgba(22,163,74,.10);border-left:4px solid var(--ok);padding:7px 11px;border-radius:6px;margin:10px 0}
html[data-theme="dark"] .expl .ansx{background:rgba(34,197,94,.15)}

/* v9.00 履歴フロート 🕒 (左スタック246px) */
#histFab{position:fixed;left:14px;bottom:calc(246px + env(safe-area-inset-bottom,0));z-index:25;background:#7c3aed;color:#fff;border:0;border-radius:50%;width:50px;height:50px;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.28);display:none}
#histFab.show{display:block}
#histFab:active{transform:scale(.93)}
#histPanel{position:fixed;left:10px;right:10px;max-width:360px;margin:0 auto;bottom:calc(244px + env(safe-area-inset-bottom,0));z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:50vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none}
#histPanel.show{display:block}
#histPanel .dpbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:sticky;top:-10px;background:var(--card);padding:4px 0}

/* v9.02 下部バージョン表示(小・タップ透過) */
#verTag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(57px + env(safe-area-inset-bottom,0));z-index:9;font-size:10px;line-height:1.4;color:var(--sub);opacity:.55;pointer-events:none;background:var(--bg);padding:0 7px;border-radius:7px}

/* v9.05 復習: 出題回セレクタ */
#revExamWrap{margin:4px 0}
.revpanel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:4px}
.revgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px}
.revck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);padding:3px 2px}
.revck input{width:16px;height:16px;flex:0 0 auto}
#revExamToggle.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* v9.08 フロート透過トグル(クリック透過・文字は不透明で可読) */
#dataPanel.floatAlpha,#guidePanel.floatAlpha{background:rgba(255,255,255,.62);box-shadow:0 6px 20px rgba(0,0,0,.18);border-color:transparent;pointer-events:none}
html[data-theme="dark"] #dataPanel.floatAlpha,html[data-theme="dark"] #guidePanel.floatAlpha{background:rgba(15,23,42,.66)}

<script>window.__PUBLIC__=true;window.__CONTENT_MANIFEST__={"schema":1,"public_origin":"original","collections":{"qdata":{"origin":"third_party","label":"穴埋め"},"kdata":{"origin":"third_party","label":"過去問"},"calcs":{"origin":"original","label":"計算"},"memo":{"origin":"original","label":"暗記"},"protocols":{"origin":"original","label":"解法プロトコル"}}};</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('qdata').textContent);
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
const FIELDS = {A:'年金・社保',C:'金融',D:'タックス',E:'不動産',F:'相続・事業承継'};
const store = {
  get(k,d){try{const v=localStorage.getItem('fp1_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('fp1_'+k,JSON.stringify(v))}catch(e){}}
};
let srs = store.get('srs',{});
let csrs = store.get('csrs',{});
let psrs = store.get('psrs',{});
let phist = store.get('phist',{});
const DAY = 86400000;
let msrs = store.get('msrs',{}); // 暗記カード用
let qhist = store.get('qhist',{});
let qReview = store.get('qReview',false);
// ---- SM-2間隔反復(Anki系アルゴリズム) ----

// ===== 入力採点ヘルパー(表記ゆれ吸収・甘め) =====
function normJ(x){return String(x==null?'':x)
  .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[，、]/g,',').replace(/[．]/g,'.').replace(/[％]/g,'%')
  .replace(/[（）()\[\]【】「」]/g,'').replace(/[\s　]/g,'')
  .replace(/(約|およそ|おおよそ|なお|円|個|名|人|年間|か月|カ月|ヶ月|箇月|平方メートル|㎡|m2)/g,'')
  .replace(/[,]/g,'').toLowerCase().trim();}
function numOf(x){let t=String(x==null?'':x).replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，\s円%]/g,'');if(!/\d/.test(t))return null;let total=0,matched=false;const re=/(-?\d+(?:\.\d+)?)(億|万|千)?/g;let m;while((m=re.exec(t))){if(m[0]==='')break;matched=true;let v=parseFloat(m[1]);const u=m[2];v*=(u==='億'?1e8:u==='万'?1e4:u==='千'?1e3:1);total+=v;}return matched?total:null;}
function ansInputMode(a){var t=String(a==null?'':a);if(/[\/／]|分の/.test(t))return 'text';return (numOf(t)!=null)?'decimal':'text';}
function softEq(inp,ans){if(inp==null||String(inp).trim()==='')return false;const a=normJ(inp),b=normJ(ans);if(a===''||b==='')return a===b;if(a===b)return true;if(/\//.test(a)||/\//.test(b))return a===b;const na=numOf(inp),nb=numOf(ans);if(na!=null&&nb!=null)return Math.abs(na-nb)<1e-6||(nb!==0&&Math.abs(na-nb)/Math.abs(nb)<1e-4);if(na!=null||nb!=null)return false;if(b.length>=2&&(a.includes(b)||b.includes(a)))return true;return false;}
// ===== 合格可能性 =====
function fieldStat(field){const items=[];
  if(typeof DATA!=='undefined')DATA.filter(x=>x.field===field).forEach(x=>items.push(['q',x.id]));
  if(typeof CALCS!=='undefined')CALCS.filter(x=>x.field===field).forEach(x=>items.push(['c',x.id]));
  if(typeof PROTOCOLS!=='undefined')PROTOCOLS.filter(x=>x.field===field).forEach(x=>items.push(['p','p_'+x.id]));
  if(!items.length)return null;let sum=0,seenN=0;
  for(const [t,id] of items){const m=t==='q'?srs[id]:t==='p'?psrs[id]:csrs[id];
    if(m&&m.seen>0){seenN++;const acc=Math.max(0,(m.seen-(m.ng||0))/m.seen);const mast=Math.min(1,(m.box||0)/5);sum+=acc*0.5+mast*0.5;}}
  if(seenN===0)return 0;
  const avgSeen=sum/seenN;const cover=seenN/items.length;
  return avgSeen*(0.4+0.6*cover)*100;}
function computePass(){const fs=['A','C','D','E','F'].map(f=>({f,v:fieldStat(f)||0}));
  const overall=fs.reduce((a,b)=>a+b.v,0)/fs.length;
  let prob=Math.round(99/(1+Math.exp(-(overall-50)/8)));prob=Math.max(1,Math.min(99,prob));
  return {fs,overall,prob};}
function passCardHtml(){const p=computePass();const col=p.prob>=70?'var(--ok)':p.prob>=40?'var(--warn)':'var(--ng)';
  const bars=p.fs.map(x=>`<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${x.f}分野 ${FIELDS[x.f]}</span><span style="font-weight:700">${Math.round(x.v)}</span></div><div class="gbar"><div style="height:100%;width:${Math.round(x.v)}%;background:${x.v>=60?'var(--ok)':x.v>=40?'var(--warn)':'var(--ng)'};transition:width .5s"></div></div></div>`).join('');
  return `<div class="card"><div style="text-align:center"><div style="font-size:13px;color:var(--sub)">現時点の合格可能性</div><div style="font-size:42px;font-weight:800;color:${col};line-height:1.1">${p.prob}%</div><div class="small">応用編 合格ライン60%基準 ／ 実力スコア ${Math.round(p.overall)}</div></div><div style="margin-top:10px">${bars}</div><div class="small" style="margin-top:8px;color:var(--sub)">※分野別の正答率×定着度×網羅率から算出。学習を重ねると上がります。</div></div>`;}

// SRS品質 q: 0=もう一度 / 1=むずい / 2=○(true) / 3=◎簡単。boolean後方互換(true→2,false→0)
function srsNext(r0,q){
  let r = Object.assign({ef:2.5,ivl:0,reps:0,due:0,seen:0,ng:0,box:0}, r0||{});
  if(r.ef===undefined){r.ef=2.5;r.ivl=[0,1,3,7,14,30][r.box]||0;r.reps=r.box} // 旧形式移行
  r.seen++;
  if(q<=0){
    r.reps=0; r.ng++;
    r.ef = Math.max(1.3, r.ef-0.3);
    r.ivl = 0;
    r.due = Date.now() + 600000; // 10分後に再学習
  }else{
    const prev=r.ivl;
    r.reps++;
    r.ef = Math.max(1.3, r.ef + (q===1?-0.15 : q===3?0.15 : 0.1));
    let base = r.reps===1?1 : r.reps===2?3 : Math.round(prev*r.ef);
    if(q===1) base = r.reps<=2 ? base : Math.max(prev+1, Math.round(prev*1.2)); // むずい:ゆっくり伸ばす
    else if(q===3) base = Math.round(base*1.3); // 簡単:ボーナス
    r.ivl = Math.max(1, base);
    r.due = Date.now() + r.ivl*DAY;
  }
  r.box = Math.min(r.reps,5);
  return r;
}
function srsStoreKey(map){return map===srs?'srs':map===csrs?'csrs':map===psrs?'psrs':(typeof ksrs!=='undefined'&&map===ksrs)?'ksrs':'msrs';}
function grade(map,id,q){
  if(q===true)q=2; else if(q===false)q=0;
  map[id]=srsNext(map[id],q);
  store.set(srsStoreKey(map),map);
  logStudy();
  renderBanner();
}
// 次回出題までの間隔プレビュー(副作用なし)
function srsPreview(map,id,q){const r=srsNext(map[id],q);return q<=0?'10分':r.ivl+'日';}
function dueCount(map,pool){const now=Date.now();return pool.filter(x=>map[x]&&map[x].due<=now).length}
function logStudy(){const d=new Date().toISOString().slice(0,10);const lg=store.get('studyLog',{});lg[d]=(lg[d]||0)+1;store.set('studyLog',lg);try{renderGoal()}catch(e){}}
function todayCount(){return (store.get('studyLog',{})[new Date().toISOString().slice(0,10)])||0}
function studyStreak(){
  const lg=store.get('studyLog',{});const DAYMS=86400000;let n=0;const t=new Date();t.setHours(0,0,0,0);
  for(let i=0;i<400;i++){const d=new Date(t.getTime()-i*DAYMS).toISOString().slice(0,10);
    if(lg[d])n++; else if(i===0)continue; else break;}
  return n;
}
function totalDue(){
  const now=Date.now();
  let n=DATA.filter(x=>srs[x.id]&&srs[x.id].due<=now).length;
  if(typeof CALCS!=='undefined')n+=CALCS.filter(x=>csrs[x.id]&&csrs[x.id].due<=now).length;
  if(typeof PROTOCOLS!=='undefined')n+=PROTOCOLS.filter(x=>psrs['p_'+x.id]&&psrs['p_'+x.id].due<=now).length;
  if(typeof MEMO!=='undefined')n+=MEMO.filter((x,i)=>msrs['m'+i]&&msrs['m'+i].due<=now).length;
  if(typeof ksrs!=='undefined'){for(const id in ksrs){if(ksrs[id].due<=now)n++}}
  return n;
}
function renderBanner(){
  const now=Date.now();
  const q=DATA.filter(x=>srs[x.id]&&srs[x.id].due<=now).length;
  const c=((typeof CALCS!=='undefined')?CALCS.filter(x=>csrs[x.id]&&csrs[x.id].due<=now).length:0)+((typeof PROTOCOLS!=='undefined')?PROTOCOLS.filter(x=>psrs['p_'+x.id]&&psrs['p_'+x.id].due<=now).length:0);
  const m=(typeof MEMO!=='undefined')?MEMO.filter((x,i)=>msrs['m'+i]&&msrs['m'+i].due<=now).length:0;
  let k=0;
  if(typeof ksrs!=='undefined'){for(const id in ksrs){if(ksrs[id].due<=now)k++}}
  const total=q+c+m+k;
  document.getElementById('queueBanner').innerHTML = total?
   `<div class="qb">📅 今日の復習: 穴埋め${q}・計算${c}・過去問${k}・暗記${m} <button onclick="startQueue()">開始</button></div>`:'';
}
function queueDueItems(now){
  const out=[];
  DATA.forEach(function(q){const r=srs[q.id];if(r&&r.due<=now)out.push({type:'q',id:q.id,due:r.due});});
  if(typeof CALCS!=='undefined')CALCS.forEach(function(c){const r=csrs[c.id];if(r&&r.due<=now)out.push({type:'c',id:c.id,due:r.due});});
  if(typeof PROTOCOLS!=='undefined')PROTOCOLS.forEach(function(p){const id='p_'+p.id,r=psrs[id];if(r&&r.due<=now)out.push({type:'c',id:id,field:p.field,due:r.due,protocol:true});});
  if(typeof MEMO!=='undefined')MEMO.forEach(function(_,i){const id='m'+i,r=msrs[id];if(r&&r.due<=now)out.push({type:'m',id:id,index:i,due:r.due});});
  if(typeof KAKO!=='undefined'&&typeof ksrs!=='undefined')Object.keys(ksrs).forEach(function(id){
    const r=ksrs[id],m=/^k(.+)-(\d+)$/.exec(id);if(!r||r.due>now||!m||!KAKO[m[1]])return;
    let found=null;KAKO[m[1]].dm.some(function(d){return d.qs.some(function(q){if(String(q.qno)!==m[2])return false;found=d;return true;});});
    if(found)out.push({type:'k',id:id,exam:m[1],field:found.field,qno:m[2],due:r.due});
  });
  return out.sort(function(a,b){return a.due-b.due;});
}
function startQueue(){
  const task=queueDueItems(Date.now())[0];if(!task){renderBanner();return;}
  if(task.type==='q'){qForceId=task.id;showTab('q');renderQ();return;}
  if(task.type==='c'){showTab('c');if(task.protocol&&typeof startProtocol==='function')startProtocol(task.id.slice(2));else if(typeof startCalc==='function')startCalc(task.id);return;}
  if(task.type==='m'){showTab('m');memoCur=task.index;memoFlip=false;drawMemo();return;}
  if(task.type==='k')gotoK(task.exam,task.field,task.qno);
}

let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}}
['touchend','click','pointerdown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
function beep(freqs,dur=0.09,type='sine',gain=0.12){
  if(!game.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(gain,actx.currentTime+i*dur);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+i*dur+dur);
      o.connect(g);g.connect(actx.destination);
      o.start(actx.currentTime+i*dur);o.stop(actx.currentTime+i*dur+dur);
    });
  }catch(e){}
}

function fxCorrect(card){
  game.score=Math.min(100,game.score+15);
  game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
  saveGame();
  sndDingdong();
  tickHonban();
  if(card){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash')}
  if(game.calm)return;
  const f=document.createElement('div');f.className='float plus';f.textContent='+15';document.body.appendChild(f);
  setTimeout(()=>f.remove(),1000);
  const cb=document.getElementById('comboP');cb.classList.add('bump');setTimeout(()=>cb.classList.remove('bump'),200);
  if(game.combo>=3){
    const m=document.createElement('div');m.className='comboMsg';
    m.textContent=game.combo+' COMBO'+(game.combo>=10?'!!! 🏆':game.combo>=5?'!! ⚡':'!');
    document.body.appendChild(m);setTimeout(()=>m.remove(),1200);
  }
  const n=Math.min(4+game.combo*2,24);
  for(let i=0;i<n;i++){
    const s=document.createElement('div');s.className='spark';
    s.style.left='50%';s.style.top='40%';
    s.style.background=pick(['#f59e0b','#2563eb','#16a34a','#ec4899','#8b5cf6']);
    s.style.setProperty('--dx',(Math.random()*260-130)+'px');
    s.style.setProperty('--dy',(Math.random()*-220-20)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
}

const TERMS = ['前々月','前々年','障害認定日','初診日','法定相続分','普通決議','特別決議','過半数','支給単位期間','標準報酬月額','標準報酬額','課税価格','基礎控除','生計維持','特定疾病','現役並み所得者','市街化区域','市街化調整区域','普通借地権','定期借地権','登録免許税','不動産取得税','固定資産税','青色申告特別控除','損益通算','繰越控除','概算取得費','被保険者期間','受給資格期間','合算対象期間','報酬比例','経過的加算','中高齢寡婦加算','振替加算','遺留分'];
const NUMRE = /([0-9０-９][0-9０-９,，.．]*)(割|％|%|歳|年間|年|カ月|か月|ヵ月|月分|月|日間|日|週間|床|万円|億円|円|倍|人|㎡|m|親等|区分|段階|種類|分の[0-9０-９]+)/g;
function autoTokens(text){
  const toks=[];let m;
  NUMRE.lastIndex=0;
  while((m=NUMRE.exec(text))){toks.push({i:m.index,len:m[0].length,t:m[0]})}
  for(const t of TERMS){let p=0;while((p=text.indexOf(t,p))>=0){toks.push({i:p,len:t.length,t});p+=t.length}}
  return toks.filter(t=>!/^[0-9０-９,，.．]+$/.test(t.t));
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtExpl(t){
  if(!t)return '';
  return String(t).split('\n').map(function(ln){
    if(ln.trim()==='')return '';
    var e=esc(ln),tr=ln.trim();
    if(/^(よって|したがって|以上より|したがいまして)/.test(tr)&&/(正解|答え|答は)/.test(tr)){return '<div class="ansx">'+e+'</div>';}
    var ender=/[。、）)]$/.test(tr);
    var isFormula=(/[＝=]/.test(ln)||(/[×]/.test(ln)&&/[／/]/.test(ln)))&&/[×÷／/＋－+\-（）()]/.test(ln)&&!ender;
    if(isFormula||/^[＝=]/.test(tr)){return '<div class="calc">'+e+'</div>';}
    return '<div class="el">'+e+'</div>';
  }).join('');
}

function ansSections(q){
  // 設問のローマ数字節〈…〉を見出しとして検出し、各空欄①…を節に割り当てる
  const txt=q.q||'';
  const re=/(?:^|\n|。|」|　)\s*((?:[IVXivx]+|[ⅠⅡⅢⅣⅤⅥⅦ]))[\.．]\s*〈([^〉]+)〉/g;
  let m,marks=[];
  while((m=re.exec(txt))){marks.push({pos:m.index,title:m[1].toUpperCase()+'. 〈'+m[2]+'〉'})}
  if(marks.length<2)return null; // 2節以上ある時だけ見出し化
  const secs=marks.map(mk=>({title:mk.title,pos:mk.pos,nums:[]}));
  for(let i=1;i<=q.n;i++){
    const c=CIRC[i-1];
    let pp=txt.indexOf('（ '+c+' ）'); if(pp<0)pp=txt.indexOf(c);
    let si=0; for(let s=0;s<secs.length;s++){if(secs[s].pos<=pp)si=s;}
    secs[si].nums.push(i);
  }
  return secs;
}
function ansTable(q){
  const secs=ansSections(q);
  let t='<table class="anstable">';
  if(secs){
    secs.forEach(s=>{
      if(!s.nums.length)return;
      t+=`<tr class="anssec"><td colspan="2">${esc(s.title)}</td></tr>`;
      s.nums.forEach(i=>{t+=`<tr><td>${CIRC[i-1]}</td><td>${esc(q.a[i]||'')}</td></tr>`});
    });
    return t+'</table>';
  }
  for(let i=1;i<=q.n;i++){t+=`<tr><td>${CIRC[i-1]}</td><td>${esc(q.a[i]||'')}</td></tr>`}
  return t+'</table>';
}
function applyX(){
  const qt = document.getElementById('qt');
  const tw = document.createTreeWalker(qt, NodeFilter.SHOW_TEXT, {
    acceptNode:n=>n.parentElement.closest('.blank,.xblank')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  let cands=[];
  nodes.forEach((nd,ni)=>{autoTokens(nd.nodeValue).forEach(t=>cands.push({ni,...t}))});
  cands = cands.sort(()=>Math.random()-.5).slice(0,6);
  const byNode={};cands.forEach(c=>{(byNode[c.ni]=byNode[c.ni]||[]).push(c)});
  Object.keys(byNode).forEach(ni=>{
    byNode[ni].sort((a,b)=>b.i-a.i).forEach(c=>{
      const nd=nodes[ni];const txt=nd.nodeValue;
      if(!nd.parentNode)return;
      const tok=txt.slice(c.i,c.i+c.len);
      if(tok!==c.t)return;
      const sp=document.createElement('span');sp.className='xblank';sp.dataset.a=tok;sp.textContent='？';sp.onclick=function(){rev(this)};
      const afterNode=document.createTextNode(txt.slice(c.i+c.len));
      nd.nodeValue=txt.slice(0,c.i);
      nd.parentNode.insertBefore(sp,nd.nextSibling);
      nd.parentNode.insertBefore(afterNode,sp.nextSibling);
    });
  });
}

function calcEval(str){let s=String(str).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[，,]/g,'').replace(/\s/g,'');if(s==='')return '';let pos=0;const peek=()=>s[pos];
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const op=s[pos++];const t=term();v=op==='+'?v+t:v-t;}return v;}
  function term(){let v=fac();while(peek()==='*'||peek()==='/'){const op=s[pos++];const f=fac();v=op==='*'?v*f:v/f;}return v;}
  function fac(){if(peek()==='+'){pos++;return fac();}if(peek()==='-'){pos++;return -fac();}if(peek()==='('){pos++;const v=expr();if(peek()===')')pos++;else throw 'e';return v;}let n='';while(pos<s.length&&/[\d.]/.test(s[pos]))n+=s[pos++];if(n===''||(n.match(/\./g)||[]).length>1)throw 'e';return parseFloat(n);}
  try{const v=expr();if(pos!==s.length||!isFinite(v))return 'エラー';return String(Math.round(v*1e8)/1e8);}catch(e){return 'エラー';}}
let calcExpr='';
function calcRender(){const d=document.getElementById('calcDisp');if(d)d.textContent=calcExpr||'0';const p=document.getElementById('calcPrev');if(p){const r=calcExpr?calcEval(calcExpr):'';p.textContent=(r&&r!=='エラー'&&r!==calcExpr)?('= '+Number(r).toLocaleString()):(r==='エラー'?'式エラー':'');}}
function calcKey(ch){if(ch==='C')calcExpr='';else if(ch==='B')calcExpr=calcExpr.slice(0,-1);else if(ch==='='){const r=calcEval(calcExpr);if(r!=='エラー'&&r!=='')calcExpr=r;}else calcExpr+=ch;calcRender();try{focusDraftChanged()}catch(e){}}

function publicHasTabContent(t){
  if(!window.__PUBLIC__)return true;
  try{
    if(t==='q')return DATA.length>0;
    if(t==='c')return CALCS.length>0||PROTOCOLS.length>0;
    if(t==='k')return Object.keys(KAKO).length>0;
    if(t==='m')return MEMO.length>0;
  }catch(e){return false;}
  return true;
}
function publicFallbackTab(){
  var choices=['c','m','q','k','s'];
  for(var i=0;i<choices.length;i++)if(publicHasTabContent(choices[i]))return choices[i];
  return 's';
}
function showTab(t){
  if(window.__PUBLIC__&&!publicHasTabContent(t))t=publicFallbackTab();
  try{focusCaptureCurrent()}catch(e){}
  window.__tab=t;
  ['q','c','k','m','s'].forEach(x=>{
    document.getElementById('pane'+x.toUpperCase()).classList.toggle('hidden',x!==t);
    document.getElementById('tab'+x.toUpperCase()).classList.toggle('on',x===t);
  });
  if(t==='s')renderStats(); if(t==='c'&&!document.getElementById('cArea').innerHTML)renderCalcMenu();

  if(t==='k'&&!document.getElementById('kArea').innerHTML)renderKako();
  const fab=document.getElementById('fab'); if(fab)fab.classList.toggle('show', t==='q'||t==='c');
  try{renderGoal()}catch(e){} try{updateCalcFab()}catch(e){} try{updateGradeFab()}catch(e){} try{updateHistFab()}catch(e){}

}

  }

  const t=[[10e6,.10,0],[30e6,.15,.5e6],[50e6,.20,2e6],[100e6,.30,7e6],[200e6,.40,17e6],[300e6,.45,27e6],[600e6,.50,42e6],[1/0,.55,72e6]];

}
// 所得税の速算表(課税総所得金額→算出税額)
function incomeTax(k){
  const t=[[1950000,.05,0],[3300000,.10,97500],[6950000,.20,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.40,2796000],[1/0,.45,4796000]];
  for(const[u,r,d]of t)if(k<=u)return Math.round(k*r-d);
}
// 特定親族特別控除(令和7年分以後・特定親族の合計所得金額→控除額)
function tokuteiShinzoku(g){
  if(g<=580000)return 0;
  const t=[[850000,630000],[900000,610000],[950000,510000],[1000000,410000],[1050000,310000],[1100000,210000],[1150000,110000],[1200000,60000],[1230000,30000]];
  for(const[u,v]of t)if(g<=u)return v;
  return 0;
}
// 基礎控除額(令和7年度改正・令和7年分以後。合計所得金額で段階的。132万超655万以下の上乗せは令和7・8年分限定で令和9年分以後は58万)
function kisoControl(g){

  if(g<=24000000)return 480000;
  if(g<=24500000)return 320000;
  if(g<=25000000)return 160000;
  return 0;
}
// 居住用区分所有財産(マンション)の区分所有補正率(令和6年1月1日以後)
function mansionHosei(chiku,floors,kai,senyu,shikichi){
  const A=chiku*-0.033;
  const idx=Math.min(1,Math.floor(floors/33*1000)/1000);
  const B=Math.floor(idx*0.239*1000)/1000;
  const C=(kai<=0?0:kai)*0.018;
  const kyoshou=Math.ceil(shikichi/senyu*1000)/1000;
  const D=-(Math.ceil(kyoshou*1.195*1000)/1000);
  const kairi=Math.round((A+B+C+D+3.220)*1000)/1000;
  const suijun=1/kairi;
  let hosei;
  if(suijun<0.6)hosei=Math.round(kairi*0.6*10000)/10000;
  else if(suijun<=1)hosei=1;
  else hosei=kairi;
  return {A,idx,B,C,kyoshou,D,kairi,suijun,hosei};
}

{id:'C_zaimu',field:'C',indep:true,termsel:true,name:'財務分析(連結財務データから8指標・自己資本は導出)',gen(){
  // 単位:百万円。BS/PLを整合生成し、使わない項目(ダミー)も与件に含める

  const hishihai=pick([0,1000,2000]);                // 非支配株主持分
  const junShisan=jiko+shinkabu+hishihai;            // 純資産
  const kofu=ri(100,400,10);                         // 固定負債
  const ryuFusai=ri(150,500,10);                     // 流動負債(ダミー)
  const debt=kofu+ryuFusai;                          // 負債合計
  const sou=junShisan+debt;                          // 資産合計=総資本
  const koteiShisan=Math.round(sou*pick([0.5,0.55,0.6,0.65])/10)*10; // 固定資産
  const ryuShisan=sou-koteiShisan;                   // 流動資産(ダミー)
  const op=ri(80,300,5);                             // 営業利益
  const intIn=ri(2,20);                              // 受取利息・配当金
  const intOut=ri(5,40);                             // 支払利息
  const keijo=op+intIn-intOut;                       // 経常利益(ダミー)
  const profit=Math.round(keijo*pick([0.6,0.65,0.7,0.75])); // 当期純利益
  const div=Math.round(profit*pick([0.20,0.25,0.30,0.35,0.40])); // 配当金総額
  const uriage=ri(800,2500,50);                      // 売上高(ダミー)
  const urisoueki=Math.round(uriage*pick([0.20,0.25,0.30,0.35])); // 売上総利益(ダミー)
  const roe=profit/jiko*100;
  const roa=(op+intIn)/sou*100;
  const jihi=jiko/sou*100;
  const fusaiR=debt/jiko*100;
  const koteki=koteiShisan/(jiko+kofu)*100;
  const ph=div/profit*100;
  const sus=roe*(1-div/profit);
  const icr=(op+intIn)/intOut;
  return {body:`X社の連結財務データ(単位：百万円)に基づき、(1)ROE(自己資本当期純利益率)、(2)使用総資本事業利益率、(3)自己資本比率、(4)負債比率、(5)固定長期適合率、(6)配当性向、(7)サスティナブル成長率、(8)インタレスト・カバレッジ・レシオを求めなさい。
〈損益計算書〉
・売上高：${fmt(uriage)} ・売上総利益：${fmt(urisoueki)}
・営業利益：${fmt(op)} ・営業外収益(受取利息・配当金)：${fmt(intIn)} ・営業外費用(支払利息)：${fmt(intOut)}
・経常利益：${fmt(keijo)} ・当期純利益：${fmt(profit)} ・配当金総額：${fmt(div)}
〈貸借対照表〉
・流動資産：${fmt(ryuShisan)} ・固定資産：${fmt(koteiShisan)} ・資産合計：${fmt(sou)}
・流動負債：${fmt(ryuFusai)} ・固定負債：${fmt(kofu)} ・負債合計：${fmt(debt)}
・純資産：${fmt(junShisan)}（うち新株予約権：${fmt(shinkabu)}／非支配株主持分：${fmt(hishihai)}）
※小数点以下第3位を四捨五入し、第2位まで解答（自己資本・事業利益は資料から各自で求めること）`,
  process:`(0) 自己資本 = 純資産${fmt(junShisan)} − 新株予約権${fmt(shinkabu)} − 非支配株主持分${fmt(hishihai)} = ${fmt(jiko)}(百万円)
(1) ROE = 当期純利益${fmt(profit)} / 自己資本${fmt(jiko)} × 《SHOW:100》 = ${f2(roe)}%
(2) 使用総資本事業利益率 = (営業利益${fmt(op)}+受取利息配当金${fmt(intIn)}) / 総資本${fmt(sou)} × 《SHOW:100》 = ${f2(roa)}%
(3) 自己資本比率 = 自己資本${fmt(jiko)} / 総資本${fmt(sou)} × 《SHOW:100》 = ${f2(jihi)}%
(4) 負債比率 = 負債${fmt(debt)} / 自己資本${fmt(jiko)} × 《SHOW:100》 = ${f2(fusaiR)}%
(5) 固定長期適合率 = 固定資産${fmt(koteiShisan)} / (自己資本${fmt(jiko)}+固定負債${fmt(kofu)}) × 《SHOW:100》 = ${f2(koteki)}%
(6) 配当性向 = 配当金${fmt(div)} / 当期純利益${fmt(profit)} × 《SHOW:100》 = ${f2(ph)}%
(7) サスティナブル成長率 = ROE × 《SEL:(1−配当性向),配当性向,(1+配当性向)=(1−配当性向)》 = ${f2(sus)}%
(8) ICR = (営業利益${fmt(op)}+受取利息配当金${fmt(intIn)}) / 支払利息${fmt(intOut)} = ${f2(icr)}倍`,
  ans:`ROE ${f2(roe)}%、使用総資本事業利益率 ${f2(roa)}%、自己資本比率 ${f2(jihi)}%、負債比率 ${f2(fusaiR)}%、固定長期適合率 ${f2(koteki)}%、配当性向 ${f2(ph)}%、サスティナブル成長率 ${f2(sus)}%、ICR ${f2(icr)}倍`};
}},

{id:'C_port',field:'C',name:'ポートフォリオの期待収益率・標準偏差',indep:true,gen(){
  const w1=pick([0.4,0.5,0.6]),w2=1-w1;
  const r1=ri(10,60)/10,r2=ri(10,80)/10,s1=ri(50,150)/10,s2=ri(80,250)/10;
  const rho=pick([-0.5,-0.2,0,0.2,0.5]);
  const er=w1*r1+w2*r2;
  const va=w1*w1*s1*s1+w2*w2*s2*s2+2*w1*w2*rho*s1*s2;
  const sd=Math.sqrt(va);
  return {body:`資産Aに${Math.round(w1*100)}%、資産Bに${Math.round(w2*100)}%投資するポートフォリオの期待収益率と標準偏差を求めなさい。〔条件〕
・資産A:期待収益率${r1}%、標準偏差${s1}% / 資産B:期待収益率${r2}%、標準偏差${s2}%
・相関係数:${rho}
※小数点以下第3位四捨五入`,
  process:`期待収益率 = 《T:資産Aの構成比》×《T:資産Aの期待収益率》 + 《T:資産Bの構成比》×《T:資産Bの期待収益率》 = ${w1}×${r1} + ${w2}×${r2} = ${f2(er)}%
分散 = ${w1}²×${s1}² + ${w2}²×${s2}² + 《SHOW:2》×${w1}×${w2}×${rho}×${s1}×${s2} = ${f2(va)}
標準偏差 = √《REF:${f2(va)}|分散》 = ${f2(sd)}%`,
  ans:`期待収益率${f2(er)}%、標準偏差${f2(sd)}%`};
}},

{id:'D_genka',field:'D',cat:'法人',name:'減価償却の償却超過額(定率法)',gen(){

}},

{id:'D_houjin',field:'D',cat:'法人',termsel:true,name:'別表四(個別の申告調整→所得金額)→法人税額',gen(){
  const rieki=ri(2000,7000,100)*10000;

  const dummyKind=pick(['損金算入限度額内で適正に損金算入された交際費','損金算入が認められた一般寄附金','前期に申告調整済で当期は処理不要の項目']);
  const dummy=ri(10,60,10)*10000;        // ダミー(調整不要)

  return {body:`期末資本金1億円以下の中小法人X社(適用除外事業者ではない)について、別表四による所得金額と当期の法人税額を求めなさい。〔損益計算書・別表四の資料〕

〈申告調整に関する事項〉
・損金経理をした法人税・住民税：${fmt(houjinzei)}円
・損金経理をした納税充当金：${fmt(juto)}円
・減価償却超過額：${fmt(genchoka)}円
・交際費等の損金不算入額：${fmt(kosai)}円
・受取配当等の益金不算入額：${fmt(haitou)}円
・納税充当金から支出した事業税等：${fmt(jigyozei)}円

・税率：年800万円以下の部分15%、800万円超の部分23.2%
※申告調整が必要な項目を自分で判断すること（調整不要の項目も含まれる）。法人税額は100円未満切捨て`,
  process:`(1) 加算項目 = 法人税・住民税${fmt(houjinzei)} + 納税充当金${fmt(juto)} + 減価償却超過額${fmt(genchoka)} + 交際費${fmt(kosai)} = ${fmt(kasan)}円
(2) 減算項目 = 受取配当等の益金不算入${fmt(haitou)} + 納税充当金から支出した事業税等${fmt(jigyozei)} = ${fmt(gensan)}円
　※「${dummyKind}」は加算も減算もしない(調整不要)
(3) 所得金額 = 当期利益${fmt(rieki)} + 加算${fmt(kasan)} − 減算${fmt(gensan)} = ${fmt(shotoku)}円

  ans:`所得金額${fmt(shotoku)}円、法人税額${fmt(zei)}円`};

   = (${fmt(A)} − ${fmt(B)}) + ${fmt(B)}×0.2 = ${fmt(A-B)} + ${fmt(Math.round(B*0.2))} = ${fmt(shunyu)}円
 (買換取得価額${fmt(B)}円 < 譲渡価額${fmt(A)}円 → 差額は全額課税、買換分の80%のみ繰延べ)`
    : `(1) 収入金額 = 《T:譲渡価額》 × 《SEL:20%,10%=20%》 = ${fmt(A)} × 0.2 = ${fmt(shunyu)}円
 (買換取得価額${fmt(B)}円 ≥ 譲渡価額${fmt(A)}円 → 譲渡価額の80%を繰延べ)`;
  return {body:`X社の代表Aさん(個人事業)は事業用地を${fmt(A)}円で譲渡し、${fmt(B)}円の事業用資産に買い換えた(特定事業用資産の買換え特例・課税繰延割合80%＝課税割合20%)。課税長期譲渡所得金額と税額合計を求めなさい。〔条件〕

(2) 概算取得費 = ${fmt(A)} × 《SEL:5%,10%=5%》 = ${fmt(cost)}円
(3) 必要経費 = (${fmt(cost)} + ${fmt(fee)}) × ${fmt(shunyu)}/${fmt(A)} = ${fmt(keihi)}円
(4) 譲渡益 = ${fmt(shunyu)} − ${fmt(keihi)} = ${fmt(ekiRaw)}円
(5) 課税長期譲渡所得金額 = ${fmt(ekiRaw)} → 千円未満切捨て = ${fmt(eki)}円
(6) 所得税 = ${fmt(eki)} × 《SEL:15%,10%=15%》 = ${fmt(shotoku)}円
(7) 復興特別所得税 = ${fmt(shotoku)} × 《SEL:2.1%,2.0%=2.1%》 = ${fukko.toFixed(1)}円
(8) 所得税＋復興 = ${fmt(shotoku)} + ${fukko.toFixed(1)} → 百円未満切捨て = ${fmt(kokuzei)}円
(9) 住民税 = ${fmt(eki)} × 《SEL:5%,4%=5%》 → 百円未満切捨て = ${fmt(jumin)}円
(10) 税額合計 = ${fmt(kokuzei)} + ${fmt(jumin)} = ${fmt(total)}円`,
  ans:`課税長期譲渡所得${fmt(eki)}円、税額合計${fmt(total)}円`};
}},
{id:'E_setback',field:'E',name:'セットバック(2項道路)後の最大建築面積',gen(){
  const w=pick([2.7,3.0,3.6]), maguchi=ri(10,20), s=ri(200,400,10);
  const taikyaku=Math.round((4-w)/2*1000)/1000;
  const sb=Math.round(taikyaku*maguchi*100)/100;
  const yukou=Math.round((s-sb)*100)/100;
  const kp=pick([60,80]);
  const kenpei=Math.round(yukou*kp/100*100)/100;
  return {body:`幅員${w}mの2項道路にのみ接する敷地に建築する場合の最大建築面積を求めなさい(セットバックは道路中心線から)。〔条件〕
・敷地面積:${s}㎡ / 間口(道路に接する長さ):${maguchi}m / 指定建蔽率:${kp}%`,
  process:`(1) 後退距離 = (《SHOW:4》m − ${w}m)/2 = ${taikyaku}m
(2) セットバック面積 = ${taikyaku} × ${maguchi}m = ${sb}㎡
(3) 有効敷地面積 = ${s} − ${sb} = ${yukou}㎡
(4) 最大建築面積 = 《T:有効敷地面積》 × 《T:建蔽率》 = ${yukou} × ${kp}% = ${fmt(kenpei)}㎡`,
  ans:`${fmt(kenpei)}㎡`};

{id:'E_tokutei',field:'E',name:'特定道路までの距離による容積率の緩和',gen(){

(4) 最大延べ面積 = 《T:敷地面積》 × 《T:容積率》 = ${s} × ${ypx}% = ${fmt(nobe)}㎡`,

{id:'E_shutokuzou',field:'E',name:'相続財産の取得費加算の特例',gen(){

・納付した相続税額:${fmt(souzoku)}円 / 譲渡した土地の相続税評価額(課税価格算入額):${fmt(evalJ)}円
・Aさんの相続税の課税価格＋債務控除額:${fmt(kakaku)}円
・譲渡収入:${fmt(shunyu)}円 / 取得費:${fmt(cost)}円 / 譲渡費用:${fmt(fee)}円
※課税長期譲渡所得金額は千円未満切捨て`,
  process:`(1) 取得費加算額 = 《T:相続税額》 × 《T:譲渡資産の評価額》/《T:課税価格の合計額》 = ${fmt(souzoku)} × ${fmt(evalJ)}/${fmt(kakaku)} = ${fmt(kasan)}円
(2) 譲渡益 = 《T:譲渡収入》 − (《T:取得費》 + 《T:取得費加算額》 + 《T:譲渡費用》) = ${fmt(shunyu)} − (${fmt(cost)} + 取得費加算額 + ${fmt(fee)}) = ${fmt(joutoRaw)}円
(3) 課税長期譲渡所得金額 = ${fmt(joutoRaw)} → 千円未満切捨て = ${fmt(jouto)}円`,
  ans:`課税長期譲渡所得金額 ${fmt(jouto)}円`};

{id:'E_koukan',field:'E',name:'固定資産の交換の特例(交換差金)',gen(){

(2) 譲渡所得 = 《T:交換差金》 − (《T:取得費》＋《T:譲渡費用》)×課税割合 = ${fmt(sakin)} − (${fmt(cost)}＋${fmt(fee)})×課税割合 = ${fmt(jouto)}円`,

{id:'F_souzoku',field:'F',name:'相続税の総額',gen(){

 課税価格の合計 = ${fmt(x)} + ${fmt(hoken-hikazei)} = ${fmt(katei)}円
`;
  proc+=`(1) 基礎控除 = 3,000万円+600万円×${n}人 = ${fmt(kiso)}円
(2) 課税遺産総額 = 《T:課税価格の合計額》 − 《T:遺産に係る基礎控除額》 = ${fmt(katei)} − ${fmt(kiso)} = ${fmt(base)}円

    proc+=`
 ${who}: ${fmt(amt)}円 → ${fmt(tax)}円`;
  }
  proc+=`
(4) 相続税の総額 = 各人の法定相続分に応ずる税額の合計`;
  return {body:`相続税の総額を求めなさい。〔条件〕
・死亡保険金以外の課税価格の合計:${fmt(x)}円(＝${fmt(x/10000)}万円)${hoken>0?`
・死亡保険金:${fmt(hoken)}円(相続人が受取り)`:''}

  process:proc,ans:`${fmt(total)}円`};
}},
{id:'F_nofu',field:'F',name:'各人の納付税額(配偶者軽減・2割加算)',gen(){
  const K=ri(24,40)*10000000; // 課税価格合計 2.4〜4億
  const n=3; // 配偶者+実子+孫養子
  const kiso=30000000+6000000*n;
  const base=K-kiso;
  // 法定相続分: 配偶者1/2, 子(実子・孫養子)各1/4
  const lpW=Math.floor(base/2/1000)*1000, lpC=Math.floor(base/4/1000)*1000;
  const T=Math.floor((souzokuTax(lpW)+souzokuTax(lpC)*2)/100)*100;
  // 取得割合
  const wr=pick([0.5,0.6,0.7]); const rest=(1-wr)/2;
  const wAmt=Math.round(K*wr), cAmt=Math.round(K*rest), gAmt=K-wAmt-cAmt;
  const taxW=Math.floor(T*wAmt/K), taxC=Math.floor(T*cAmt/K), taxG=Math.floor(T*gAmt/K);
  // 配偶者軽減
  const genTaisho=Math.min(wAmt, Math.max(Math.floor(K/2), 160000000));
  const genW=Math.floor(T*genTaisho/K);
  const payW=Math.floor(Math.max(0, taxW-genW)/100)*100;
  // 孫養子2割加算
  const payG=Math.floor(taxG*1.2/100)*100;
  const payC=Math.floor(taxC/100)*100;
  return {body:`相続人は配偶者・実子・孫養子(代襲相続人ではない)の3人。各人の納付すべき相続税額を求めなさい。〔条件〕
・課税価格の合計額:${fmt(K)}円(＝${fmt(K/10000)}万円) / 法定相続人3人(配偶者1/2、子は実子と孫養子で1/2を均分)
・各人の取得課税価格:配偶者${fmt(wAmt)}円 / 実子${fmt(cAmt)}円 / 孫養子${fmt(gAmt)}円
・速算表: 1,000万円以下10% / 3,000万円以下15%(控除50万円) / 5,000万円以下20%(同200万円) / 1億円以下30%(同700万円) / 2億円以下40%(同1,700万円) / 3億円以下45%(同2,700万円) / 6億円以下50%(同4,200万円)
・配偶者の税額軽減・孫養子の2割加算を考慮(その他の控除はなし)`,
  process:`① 基礎控除 = 3,000万円 + 600万円 × 3人 = ${fmt(kiso)}円
② 課税遺産総額 = 《T:課税価格の合計額》 − 《T:遺産に係る基礎控除額》 = ${fmt(K)} − ${fmt(kiso)} = ${fmt(base)}円
③ 配偶者の法定相続分の税額 = 速算表(${fmt(lpW)}) = ${fmt(souzokuTax(lpW))}円
④ 子1人の法定相続分の税額 = 速算表(${fmt(lpC)}) = ${fmt(souzokuTax(lpC))}円
⑤ 相続税の総額 = (${fmt(souzokuTax(lpW))} + ${fmt(souzokuTax(lpC))} × 2)の百円未満切捨て = ${fmt(T)}円
⑥ 配偶者の算出税額 = 《T:相続税の総額》 × 《T:配偶者の取得課税価格》/《T:課税価格の合計額》 = ${fmt(T)} × ${fmt(wAmt)}/${fmt(K)} = ${fmt(taxW)}円
⑦ 配偶者の税額軽減額 = ${fmt(T)} × ${fmt(genTaisho)}/${fmt(K)} = ${fmt(genW)}円
⑧ 配偶者の納付税額 = 《REF:${fmt(taxW)}|⑥算出》 − 《REF:${fmt(genW)}|⑦軽減》 → 100円未満切捨て = ${fmt(payW)}円
⑨ 実子の納付税額 = ${fmt(T)} × ${fmt(cAmt)}/${fmt(K)} = ${fmt(taxC)}円 → 100円未満切捨て = ${fmt(payC)}円
⑩ 孫養子の算出税額 = ${fmt(T)} × ${fmt(gAmt)}/${fmt(K)} = ${fmt(taxG)}円
⑪ 孫養子の納付税額(2割加算) = 《REF:${fmt(taxG)}|⑩算出》 × 《SEL:1.2,1.0=1.2》 → 100円未満切捨て = ${fmt(payG)}円`,
  ans:`配偶者${fmt(payW)}円・実子${fmt(payC)}円・孫養子${fmt(payG)}円`}}},

 特別控除の残額 = 25,000,000 − ${fmt(use1)} = ${fmt(spLeft)}円
(2) 2025年 課税価格 = ${fmt(x2)} − 1,100,000 = ${fmt(k2)}円
 特別控除残 ${fmt(spLeft)}円を適用 → 残り ${fmt(rem2)}円 → 贈与税 = ${fmt(rem2)} × 《SEL:20%,15%=20%》 = ${fmt(tax2)}円
(3) 相続時に加算される額 = (${fmt(x1)} − 1,100,000) + (${fmt(x2)} − 1,100,000) = ${fmt(kasan)}円
 ※年110万円の基礎控除分は相続財産に加算しない(2024年改正)`,

※非経常的な配当(記念配当等)は除く。2年平均が2円50銭未満または無配の場合は2円50銭。円未満切捨て`,
  process:`(1) 年配当金額(2年平均・記念配当除く) = (《IN:${d1}》 + 《IN:${d2}》) / 2 = ${avgRaw}円
(2) 適用する年配当金額 = ${avgRaw<2.5?'2.5円(最低保証)':avgRaw+'円'}
(3) 配当還元価額 = 《T:1株当たりの年配当金額》(${div}円) / 《SEL:10%,5%=10%》 × ${cap}円/50円 = ${fmt(ans)}円`,
  ans:`${fmt(ans)}円`}}});

// 公開版の収録可否は content_manifest を唯一の基準にする。
// 配列(DATA/CALCS/MEMO/PROTOCOLS)と連想配列(KAKO)の両方を同じ規則で処理し、
// 公開版では「コレクション分類=public_origin」かつ「項目origin=public_origin」だけを残す。
function contentManifest(){return window.__CONTENT_MANIFEST__||{public_origin:'original',collections:{}};}
function publicContentOrigin(){return contentManifest().public_origin||'original';}
function contentOrigin(name){var c=contentManifest().collections||{};return c[name]&&c[name].origin?c[name].origin:'third_party';}
function contentCollectionAllowed(name){return !window.__PUBLIC__||contentOrigin(name)===publicContentOrigin();}
function enforceContentManifest(name,items){
  var groupOrigin=contentOrigin(name),publicOrigin=publicContentOrigin(),allowed=contentCollectionAllowed(name),isList=Array.isArray(items);
  function tag(item){if(item&&typeof item==='object'&&!item.origin)item.origin=groupOrigin;return item;}
  function keep(item){return allowed&&!!item&&item.origin===publicOrigin;}
  if(isList){
    items.forEach(tag);
    if(window.__PUBLIC__)for(var i=items.length-1;i>=0;i--)if(!keep(items[i]))items.splice(i,1);
  }else if(items&&typeof items==='object'){
    Object.keys(items).forEach(function(key){var item=tag(items[key]);if(window.__PUBLIC__&&!keep(item))delete items[key];});
  }
  return items;
}
function filterReleaseContent(){
  [['qdata',DATA],['calcs',CALCS],['memo',MEMO],['protocols',PROTOCOLS]].forEach(function(pair){enforceContentManifest(pair[0],pair[1]);});
}
filterReleaseContent();

function judgeOneChukan(i){

function renshuCloze(text){
  const tstash=[];
  text=text.replace(/《SEL:[^=》]+=([^》]+)》/g,(s,a)=>{tstash.push(a);const i=tstash.length-1;return '\u0001'+String.fromCharCode(65+Math.floor(i/26))+String.fromCharCode(65+i%26)+'\u0002';});
  text=text.replace(/《IN:([^》]*)》/g,(s,a)=>{tstash.push(a);const i=tstash.length-1;return '\u0001'+String.fromCharCode(65+Math.floor(i/26))+String.fromCharCode(65+i%26)+'\u0002';});
  text=text.replace(/《T:([^》]*)》/g,(s,v)=>{tstash.push(v);const i=tstash.length-1;return '\u0001'+String.fromCharCode(65+Math.floor(i/26))+String.fromCharCode(65+i%26)+'\u0002';});
  text=stripCalcMarks(text);
  return esc(text).split('\n').map(line=>{
    const stash=[];
    const ph=h=>{const i=stash.length;stash.push(h);return '〔R'+String.fromCharCode(65+Math.floor(i/26))+String.fromCharCode(65+i%26)+'〕'};
    // 分数・万円/億円のチップは先にプレースホルダ化して、後段の数値チップ化に巻き込まれないよう保護
    line=line.replace(/(?<![\d,.])([1-9])\s*\/\s*(10|[2-9])(?![\d])/g,(s,n,m2)=>
      ph(`<span class="nblank" data-a="${n}/${m2}" onclick="rev(this)">？</span>`));
    line=line.replace(/(\d[\d,]*(?:\.\d+)?)(万円|億円)/g,(s,num,unit)=>
      ph(`<span class="nblank" data-a="${num}${unit}" onclick="rev(this)">？</span>`));
    const eq=line.search(/[=＝→]/);
    if(eq>=0){
      const head=line.slice(0,eq+1); let tail=line.slice(eq+1);
      // 用語+数値を一体で隠す(式・構成要素の想起を促す。例: 純資産2,270 → ？ で「式の構成」を思い出させる)
      tail=tail.replace(/(?<![\d０-９.,，円%㎡倍])([一-龥ぁ-んァ-ヶー々〇]+(?:[・･][一-龥ぁ-んァ-ヶー々〇]+)*)\s*(-?[\d,]+(?:\.\d+)?)(万円|億円|円|%|㎡|倍|月|万)?(?![\d])/g,(s,term,num,unit)=>{
        if(/切捨|切上|未満/.test(term))return s; // 端数処理の注記は用語扱いしない(数値は後段で隠す)
        return ph(`<span class="nblank" data-a="${term}${num}${unit||''}" onclick="rev(this)">？</span>`);});
      // 残りの裸の数値
      tail=tail.replace(/(-?[\d,]+(?:\.\d+)?)(万円|億円|円|%|㎡|倍|月|万)?(?![\d])/g,(s,num,unit)=>
        ph(`<span class="nblank" data-a="${num}${unit||''}" onclick="rev(this)">？</span>`));
      line=head+tail;
    }
    line=line.replace(/〔R([A-Z])([A-Z])〕/g,(s,a,b)=>stash[(a.charCodeAt(0)-65)*26+(b.charCodeAt(0)-65)]);
    line=line.replace(/\u0001([A-Z])([A-Z])\u0002/g,(s,a,b)=>{const v=tstash[(a.charCodeAt(0)-65)*26+(b.charCodeAt(0)-65)];return '<span class="nblank" data-a="'+esc(v)+'" onclick="rev(this)">？</span>';});
    return line;
  }).join('\n');
}

function pStat(id){

function nextProtocol(){

var rvSeen=0, rvCorrect=0, rvCurrent=null, rvRecent=[], rvCounts={t1:0,t2:0,t3:0};
function setKField(f){
  if(kView==='review'){kSeqField=f;store.set('kSeqField',f);rvRecent=[];renderKSeqFields();renderReviewOne();}
  else{startKSeq(f);}

var REVEXALL=null;
function revExamsAll(){
  if(REVEXALL)return REVEXALL;
  if(typeof KAKO==='undefined'||!KAKO)return [];
  REVEXALL=Object.keys(KAKO).filter(function(e){return /^[0-9]{4}_/.test(e);}).sort(function(a,b){
    function key(s){var pp=s.split('_');return parseInt(pp[0],10)*100+parseInt(pp[1],10);}
    return key(a)-key(b);});
  return REVEXALL;
}
function revDefaultExams(){var a=revExamsAll();var d=a.slice(-5);if(KAKO&&KAKO['moshi'])d=d.concat(['moshi']);return d;}
function getRevExams(){var v=store.get('revExams',null);if(!Array.isArray(v))v=revDefaultExams();return v;}
function setRevExams(a){store.set('revExams',a);}
function toggleRevExam(ex){var c=getRevExams().slice();var i=c.indexOf(ex);if(i>=0)c.splice(i,1);else c.push(ex);setRevExams(c);rvRecent=[];renderRevExamBar();renderReviewOne();}
function revPreset(kind){
  var all=revExamsAll(),sel=[];
  if(kind==='latest5')sel=all.slice(-5);
  else if(kind==='latest3y'){var ys=all.map(function(e){return parseInt(e.split('_')[0],10);});var mx=Math.max.apply(null,ys);sel=all.filter(function(e){return parseInt(e.split('_')[0],10)>=mx-2;});}
  else if(kind==='all')sel=all.slice();
  else sel=[];
  if(kind!=='none'&&KAKO&&KAKO['moshi'])sel=sel.concat(['moshi']);
  setRevExams(sel);rvRecent=[];renderRevExamBar();renderReviewOne();
}

function reviewCandidates(){
  if(!KFLAT)buildKFLAT();
  refreshExamFactor();
  var f=kSeqField, exsel=getRevExams(); var pool=KFLAT.filter(function(x){return (f==='ALL'||x.field===f) && exsel.indexOf(x.exam)>=0;});
  var t1=[],t2=[],t3=[];
  pool.forEach(function(it){var s=kqStat(it);it._s=s;if(s.miss3>0)t1.push(it);else if(s.miss>0)t2.push(it);else t3.push(it);});
  t1.sort(function(a,b){return (b._s.miss3-a._s.miss3)||(a._s.lastMissFromEnd-b._s.lastMissFromEnd)||(kqWeight(b.field)-kqWeight(a.field))||(b._s.lastT-a._s.lastT);});
  t2.sort(function(a,b){return (b._s.rate-a._s.rate)||(a._s.lastMissFromEnd-b._s.lastMissFromEnd)||(kqWeight(b.field)-kqWeight(a.field))||(b._s.lastT-a._s.lastT);});
  t3.sort(function(a,b){var da=kqDueInfo(a),db=kqDueInfo(b);return (db.ratio-da.ratio)||(kqWeight(b.field)-kqWeight(a.field))||(a._s.lastT-b._s.lastT);});
  return {t1:t1,t2:t2,t3:t3,ordered:t1.concat(t2,t3)};
}
function reviewPick(){
  var c=reviewCandidates();rvCounts={t1:c.t1.length,t2:c.t2.length,t3:c.t3.length};
  var ord=c.ordered;if(!ord.length)return null;
  var avoid=rvRecent.slice(-3),pick=null;
  for(var i=0;i<ord.length;i++){var k=kqKey(ord[i].exam,ord[i].field,ord[i].qno);if(avoid.indexOf(k)<0){pick=ord[i];break;}}
  if(!pick)pick=ord[0];
  return pick;
}

  var anstbl=hasA?('<table class="anstable">'+Object.entries(it.a).map(function(e){return '<tr><td>'+(CIRC[e[0]-1]||e[0])+'</td><td>'+esc(e[1])+'</td></tr>'}).join('')+'</table>'):'<div class="small">模範解答は解説内に記載</div>';
  var inputBlock='';

  var html='<div class="meta">'+bmBtn('k',it.exam+'|'+it.field+'|'+it.qno)+'<span class="badge">🔁復習</span><span class="badge">'+(function(){var d=daysToExam().days;return d>=0?'D-'+d:'試験後';})()+'</span><span class="badge">'+FIELDS[it.field]+'</span>'+(kqHot(it.field)?'<span class="badge" style="background:var(--gold);color:#fff">★</span>':'')+'<span class="badge">'+it.name+' 問'+it.qno+'</span><span>'+tierLabel+'</span><span>要復習 T1:'+rvCounts.t1+'/T2:'+rvCounts.t2+'</span><span>本セッション '+rvCorrect+'/'+rvSeen+'正答</span></div>';
  if(it.genchu)html+='<div class="qb" style="background:var(--warn);color:#fff">'+esc(it.genchu)+'</div>';
  html+='<div class="card"><details><summary>《設例》</summary><div class="qtext">'+esc(it.set)+'</div>'+(it.data?'<div class="qdata">'+it.data+'</div>':'')+'</details>'
    +'<div class="qtext" style="margin-top:10px"><b>《問'+it.qno+'》</b><br>'+(rIn?esc(it.q):kqBlanks(it.q,it.a))+'</div>'
    +inputBlock
    +'<div class="btnrow" id="rvRev">'+((rIn&&hasA)?'<button class="btn pri" onclick="rvGradeInput()">採点する</button>':'<button class="btn pri" onclick="rvReveal()">解答・解説を表示</button>')+'</div>'
    +'<div class="gradehint hidden" id="rvHint"></div>'
    +'<div class="hidden" id="rvAns">'+anstbl
    +'<details open><summary>この問の解説</summary><div class="expl">'+fmtExpl(it.expl)+'</div></details>'
    +((it.dmExpl&&it.dmExpl!==it.expl)?'<details><summary>大問の解説(全文)</summary><div class="expl">'+fmtExpl(it.dmExpl)+'</div></details>':'')
    +'<div class="btnrow"><button class="btn ok" onclick="reviewGrade(true)">○ できた</button><button class="btn ng" onclick="reviewGrade(false)">× できなかった</button></div></div>'
    +'<div class="btnrow"><button class="btn ghost" onclick="renderReviewOne()">次の問題 →(スキップ)</button></div></div>';
  document.getElementById('kArea').innerHTML=html;
  curDm=-1;curResHtml=(it.set?('<div class="qtext">'+esc(it.set)+'</div>'):'')+(it.data?'<div class="qdata">'+it.data+'</div>':'');try{updateDataFab()}catch(e){}try{updateHistFab()}catch(e){}

// ---- v9.01 試験日逆算/被覆(表示のみ。Tier出題ロジックは不変) ----
function validExamDate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return false;
  var p=String(s).split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);
  return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2];
}
function daysToExam(){
  var s=store.get('examDate','2026-09-13');if(!validExamDate(s))s='2026-09-13';
  var ex=new Date(s+'T00:00:00'); var now=new Date(); now.setHours(0,0,0,0);
  return {date:s, days:Math.round((ex.getTime()-now.getTime())/86400000)};
}
function coverageStat(){
  if(!KFLAT)buildKFLAT();
  var total=KFLAT.length, seen=0, unseen=0, t1=0, t2=0, byF={};
  KFLAT.forEach(function(it){
    var f=it.field; if(!byF[f])byF[f]={total:0,seen:0}; byF[f].total++;
    var s=kqStat(it);
    if(s.n>0){seen++;byF[f].seen++;}else{unseen++;}
    if(s.miss3>0)t1++; else if(s.miss>0)t2++;
  });
  return {total:total,seen:seen,unseen:unseen,pct:(total?Math.round(seen/total*100):0),t1:t1,t2:t2,byF:byF};
}
function setExamDate(){
  var cur=store.get('examDate','2026-09-13');
  var v=prompt('試験日を YYYY-MM-DD で入力',cur);
  if(v===null)return; v=(''+v).trim();
  if(!validExamDate(v)){alert('実在する日付をYYYY-MM-DD形式で入力してください（例 2026-09-13）');return;}
  store.set('examDate',v); try{renderStats()}catch(e){}
}
function examCoverageCardHtml(){
  var e=daysToExam(), c=coverageStat();
  var dstr=e.date.replace(/-/g,'/').replace(/\/0/g,'/');
  var dleft=e.days>0?(e.days+'日'):(e.days===0?'本日!':'経過');

  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div><div class="small">試験まで</div><div style="font-size:34px;font-weight:800;color:var(--acc);line-height:1.1">'+dleft+'</div><div class="small">'+dstr+'（学科・法令基準日4/1）</div></div>'
    +'<button class="btn ghost" style="flex:0;min-width:0;padding:6px 10px" onclick="setExamDate()">⚙ 試験日</button></div>'
    +'<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>過去問 被覆率</span><span style="font-weight:700">'+c.pct+'%（'+c.seen+'/'+c.total+'）</span></div><div class="gbar"><div style="height:100%;width:'+c.pct+'%;background:'+(c.pct>=80?'var(--ok)':c.pct>=40?'var(--warn)':'var(--ng)')+'"></div></div></div>'
    +'<div class="small" style="margin-top:8px">弱点残 <b style="color:var(--ng)">Tier1:'+c.t1+'</b> / <b style="color:var(--warn)">Tier2:'+c.t2+'</b> ・ 未着手 '+c.unseen+'問'+(perDay?' ／ 全範囲1巡まで <b>'+perDay+'問/日</b>':'')+'</div>'
    +'<div style="margin-top:8px">'+fbars+'</div>'
    +'<div class="btnrow"><button class="btn pri" onclick="showTab(\'k\');setKView(\'review\')">🔁 復習を始める</button></div></div>';
}
// ---- v9.02 (c)分野頻度重み + (b)復習用due(spacing・試験日圧縮) ----
var KFREQW={A:1.3,C:1.15,D:1.1,E:1.15,F:1.3};
function kqWeight(f){return KFREQW[f]||1.0;}
function kqHot(f){return kqWeight(f)>=1.2;}
var _examFactor=1;
function refreshExamFactor(){try{var d=daysToExam().days;_examFactor=Math.max(0.25,Math.min(1,d/45));}catch(e){_examFactor=1;}}
function kqDueInfo(it){
  var s=(it&&it._s)||kqStat(it);
  var streak=0; for(var i=s.arr.length-1;i>=0;i--){if(s.arr[i].ok)streak++;else break;}
  var sched=[1,3,7,14,28,45];
  var interval=(s.n===0)?0:(streak<=0?1:sched[Math.min(streak-1,5)]);
  var eff=interval*_examFactor;
  var daysSince=(s.n===0)?0:((Date.now()-s.lastT)/86400000);
  var ratio=(s.n===0)?0.95:(eff>0?daysSince/eff:0);
  var due=(s.n>0 && s.miss===0 && ratio>=1);
  return {streak:streak,interval:interval,eff:eff,daysSince:daysSince,ratio:ratio,due:due};
}

<script>
var __updShown=false,__swReg=null;
function updShow(){if(__updShown)return;__updShown=true;var b=document.getElementById('updBar');if(b)b.classList.remove('hidden');}
function updReload(){try{location.reload()}catch(e){}}
function updDismiss(){var b=document.getElementById('updBar');if(b)b.classList.add('hidden');}
function requestSwUpdate(){try{if(__swReg)__swReg.update()}catch(e){}}
(function(){
  if(!('serviceWorker' in navigator) || location.protocol.indexOf('http')!==0)return;
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(reg){
    __swReg=reg;
    if(reg.waiting && navigator.serviceWorker.controller)updShow();
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed' && navigator.serviceWorker.controller)updShow();
      });
    });
    setInterval(requestSwUpdate,60000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadController)updShow();});
})();
document.addEventListener('visibilitychange',function(){if(!document.hidden)requestSwUpdate();});

/* v9.18: 5〜30分の集中セッション。採点/SRSは既存処理をそのまま使い、状態だけを追加保存する。 */
var focusSession=null,focusDraft=null,focusLiveAt=0,focusTimer=0,focusDraftTimer=0,focusRestoring=false;
function focusIsActive(){return !!focusSession&&focusSession.status==='active';}
function focusAvailableTypes(){
  if(!window.__PUBLIC__)return ['q','c','k','m'];
  var out=[];
  try{if(DATA.length)out.push('q');if(CALCS.length||PROTOCOLS.length)out.push('c');if(Object.keys(KAKO).length)out.push('k');if(MEMO.length)out.push('m');}catch(e){}
  return out;
}
function focusKey(t){return t.type==='k'?'k:'+t.exam+':'+t.qno:t.type+':'+(t.id!=null?t.id:t.index);}
function focusTypes(){var all=focusAvailableTypes();if(focusSession&&focusSession.config.mode==='mix')return all;var fallback=all[0]||(window.__PUBLIC__?'c':'q');return [focusSession&&all.indexOf(focusSession.config.type)>=0?focusSession.config.type:fallback];}
function focusModeName(c){if(c.mode==='mix')return window.__PUBLIC__?'独自コンテンツ混在':'4モード混在';return {q:'穴埋め',c:'計算',k:'過去問',m:'暗記'}[c.type]||'混在';}
function focusFmt(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
function focusLimit(){return (focusSession?focusSession.config.minutes:0)*60000;}
function focusElapsed(){return focusSession?(focusSession.elapsedMs||0)+(focusIsActive()&&focusLiveAt?Math.max(0,Date.now()-focusLiveAt):0):0;}
function focusSave(){if(focusSession)store.set('focusSession',focusSession);}
function focusFlushTime(){if(!focusIsActive()||!focusLiveAt)return;var n=Date.now();focusSession.elapsedMs=(focusSession.elapsedMs||0)+Math.max(0,n-focusLiveAt);focusLiveAt=n;}
function focusStopClock(flush){if(flush)focusFlushTime();if(focusTimer){clearInterval(focusTimer);focusTimer=0;}focusLiveAt=0;}
